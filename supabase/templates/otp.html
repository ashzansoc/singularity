<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Singularity access code</title>
</head>
<body style="margin:0;padding:0;background:#0a0a0a;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;">
  <div style="max-width:480px;margin:40px auto;padding:32px 24px;">
    <h1 style="margin:0 0 8px;font-size:22px;letter-spacing:0.08em;">SINGULARITY</h1>
    <p style="margin:0 0 24px;color:#b5b5b5;line-height:1.5;">
      Enter this code in the Singularity app. Do not click any links.
    </p>
    <p style="margin:0 0 8px;font-size:13px;color:#888;text-transform:uppercase;letter-spacing:0.12em;">
      Access code
    </p>
    <p style="margin:0;font-size:36px;font-weight:700;letter-spacing:0.28em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;">
      {{ .Token }}
    </p>
    <p style="margin:28px 0 0;color:#888;font-size:13px;line-height:1.5;">
      This code expires in about an hour. If you did not request access, you can ignore this email.
    </p>
  </div>
</body>
</html>
